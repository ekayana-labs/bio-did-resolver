name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Tag must match the crate version
        id: crate
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "bio-did-resolver") | .version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != crate v$version"; exit 1; }
          # The first release is published by hand; skip versions crates.io already has.
          if curl -sf -A "release.yml (github.com/ekayana-labs/bio-did-resolver)" \
               "https://crates.io/api/v1/crates/bio-did-resolver/$version" -o /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"; echo "bio-did-resolver $version is already on crates.io; nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo test
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.crate.outputs.published == 'false'
        id: auth
      - run: cargo publish
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
