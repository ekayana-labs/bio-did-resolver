[package]
name = "bio-did-resolver"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Resolver and registry client for the did:bio DID method on Solana"
license = "MIT"
repository = "https://github.com/ekayana-labs/bio-did-resolver"
readme = "README.md"
keywords = ["did", "solana", "identity", "resolver", "cli"]
categories = ["command-line-utilities", "authentication"]
exclude = [".github/"]

[lib]
name = "bio_did_resolver"
path = "src/lib.rs"

[[bin]]
name = "bio-did-resolver"
path = "src/main.rs"

[dependencies]
did-bio-core = "0.1"
solana-client = "3"
solana-sdk = "3"
solana-commitment-config = "3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde_json = "1"
bs58 = "0.5"

[dev-dependencies]
sha2 = "0.10"
bio-did-registry = { version = "0.1", features = ["no-entrypoint"] }
